services:
  postgres:
    image: postgres:16-alpine
    container_name: ethioevents_postgres
    restart: always
    environment:
      POSTGRES_DB: ethioevents_db
      POSTGRES_USER: ethio_user
      POSTGRES_PASSWORD: ethio_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethio_user -d ethioevents_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ethioevents_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
