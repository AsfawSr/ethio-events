spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:ethioevents_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

ethioevents:
  sms:
    provider: "MOCK"
    mock-auto-verify: true
